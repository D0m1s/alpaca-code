[package]
name = "alpaca-code-rs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
relm4 = "0.11"

gtk4 = { version = "=0.11.5", features = ["v4_22"] }
gdk-pixbuf = "0.22"
sourceview5 = "0.11"
vte4 = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "alpaca-code-rs"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
