name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude:
    name: claude (on @claude mention)
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.comment.id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@42619cb7a75ded196ded275cdd529a35178bfd2c
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 30"

  review:
    name: claude review (advisory — arms once ANTHROPIC_API_KEY exists)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@42619cb7a75ded196ded275cdd529a35178bfd2c
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'